# .github/workflows/ci.yml
# ─────────────────────────────────────────────────────────
# On every push / PR to main:
#   1. Lint the Python code
#   2. Build the Docker image (ensures nothing is broken)
# ─────────────────────────────────────────────────────────

name: CI – Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install flake8

      - name: Run flake8
        run: flake8 app.py tokenizer_utils.py --max-line-length 120

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint                # only build if lint passes
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t urdu-story-api:ci .

      - name: Smoke test – container starts
        run: |
          docker run -d --name test-container -p 8000:8000 urdu-story-api:ci
          sleep 5
          curl --fail http://localhost:8000/ || exit 1
          docker stop test-container
